<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autism Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header text-center">
            <h2>Autism Prediction System</h2>
        </div>

        <div class="card-body">

            <form method="POST" action="/predict-form">

                <div class="row">

                    {% for i in range(1,11) %}
                    <div class="col-md-6 mb-3">
                        <label>A{{i}} Score</label>
                        <select class="form-select" name="A{{i}}_Score" required>
                            <option value="0">0</option>
                            <option value="1">1</option>
                        </select>
                    </div>
                    {% endfor %}

                    <div class="col-md-6 mb-3">
                        <label>Age</label>
                        <input type="number" class="form-control" name="age" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Gender</label>
                        <select class="form-select" name="gender">
                            <option value="m">Male</option>
                            <option value="f">Female</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Ethnicity</label>
                        <select class="form-select" name="ethnicity">
                            <option value="White-European">White-European</option>
                            <option value="Asian">Asian</option>
                            <option value="Black">Black</option>
                            <option value="Hispanic">Hispanic</option>
                            <option value="Latino">Latino</option>
                            <option value="South Asian">South Asian</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Jaundice</label>
                        <select class="form-select" name="jaundice">
                            <option value="no">No</option>
                            <option value="yes">Yes</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Family Member with Autism</label>
                        <select class="form-select" name="austim">
                            <option value="no">No</option>
                            <option value="yes">Yes</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Country</label>
                        <select class="form-select" name="contry_of_res">
                            <option value="India">India</option>
                            <option value="United States">United States</option>
                            <option value="United Kingdom">United Kingdom</option>
                            <option value="Australia">Australia</option>
                            <option value="Canada">Canada</option>
                            <option value="Pakistan">Pakistan</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Used App Before</label>
                        <select class="form-select" name="used_app_before">
                            <option value="no">No</option>
                            <option value="yes">Yes</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Screening Score Result</label>
                        <input type="number" step="0.01" class="form-control" name="result" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Relation</label>
                        <select class="form-select" name="relation">
                            <option value="Self">Self</option>
                            <option value="Parent">Parent</option>
                            <option value="Relative">Relative</option>
                            <option value="Others">Others</option>
                            <option value="Health care professional">
                                Health care professional
                            </option>
                        </select>
                    </div>

                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary btn-lg">
                        Predict
                    </button>
                </div>

            </form>

            {% if prediction %}
            <div class="alert mt-4 {% if 'No Autism' in prediction %}alert-success{% else %}alert-danger{% endif %}">
                <h4 class="text-center">{{ prediction }}</h4>
            </div>
            {% endif %}

        </div>
    </div>

</div>

</body>
</html>
